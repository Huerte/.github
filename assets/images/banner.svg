<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="org-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B" />
      <stop offset="50%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#030406" />
    </linearGradient>
    <linearGradient id="org-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="33%" stop-color="#3B82F6" />
      <stop offset="66%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <radialGradient id="org-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#05070B" stop-opacity="0" />
    </radialGradient>
    <pattern id="org-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#org-bg)" />
  <rect width="1200" height="420" fill="url(#org-glow)" />
  <rect width="1200" height="420" fill="url(#org-grid)" />

  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" />

  <!-- Organization Ecosystem Node Matrix (Right Side) -->
  <g transform="translate(850, 210)">
    <!-- Central Luxion Hub Sphere -->
    <circle cx="0" cy="0" r="50" fill="#0C152B" stroke="#00F2FE" stroke-width="2.5" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" />

    <!-- Connecting Lab Vector Spokes -->
    <line x1="0" y1="0" x2="-100" y2="-70" stroke="#00F2FE" stroke-width="2" stroke-opacity="0.5" />
    <line x1="0" y1="0" x2="100" y2="-70" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.5" />
    <line x1="0" y1="0" x2="-110" y2="60" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.5" />
    <line x1="0" y1="0" x2="110" y2="60" stroke="#EC4899" stroke-width="2" stroke-opacity="0.5" />

    <!-- Satellite Hub Nodes -->
    <g transform="translate(-100, -70)">
      <circle cx="0" cy="0" r="16" fill="#091428" stroke="#00F2FE" stroke-width="2" />
      <text x="0" y="4" fill="#00F2FE" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">SPATIAL</text>
    </g>
    <g transform="translate(100, -70)">
      <circle cx="0" cy="0" r="16" fill="#091428" stroke="#3B82F6" stroke-width="2" />
      <text x="0" y="4" fill="#3B82F6" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">AGENTS</text>
    </g>
    <g transform="translate(-110, 60)">
      <circle cx="0" cy="0" r="16" fill="#091428" stroke="#8B5CF6" stroke-width="2" />
      <text x="0" y="4" fill="#8B5CF6" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">CRYPTO</text>
    </g>
    <g transform="translate(110, 60)">
      <circle cx="0" cy="0" r="16" fill="#091428" stroke="#EC4899" stroke-width="2" />
      <text x="0" y="4" fill="#EC4899" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">TOOLS</text>
    </g>

    <text x="0" y="125" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1" text-anchor="middle">LUXION LABS: OPEN SOURCE ECOSYSTEM</text>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <rect width="250" height="30" rx="15" fill="#00F2FE" fill-opacity="0.12" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#00F2FE" />
    <text x="28" y="19" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">OPEN SOURCE ECOSYSTEM</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      Luxion Labs
    </text>

    <rect x="0" y="105" width="85" height="4" rx="2" fill="url(#org-grad)" />

    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      Organization profile and global community health standards for Luxion Labs projects.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Home of production spatial intelligence, self-evolving AI, and zero-knowledge protocols.
    </text>

    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">TOTAL REPOS: 23</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">STANDARDS: SETTL 16</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>